<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedQNL</title>
<style>
:root{
  --navy:#102b43;--navy2:#173e5f;--blue:#2d8de6;--blue2:#eaf5ff;
  --ink:#1e2a36;--muted:#70808e;--line:#d8e0e7;--bg:#f5f7f9;--card:#fff;
  --green:#1b7f49;--greenbg:#e9f7ef;--red:#b42318;--redbg:#fff0ed;
  --shadow:0 2px 10px rgba(10,32,52,.07);
}
body.dark{
  --navy:#eef3f7;--navy2:#d7e4ef;--blue:#68b4ff;--blue2:#12334e;
  --ink:#f1f5f8;--muted:#b6c4cf;--line:#344b5d;--bg:#0e1822;--card:#15232f;
  --green:#8be0ad;--greenbg:#123c28;--red:#ffaca1;--redbg:#431b18;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.top{height:62px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50}.top-left{display:flex;align-items:center;gap:10px}
.logo{font-size:22px;font-weight:800;color:var(--navy)}.logo span{color:var(--blue)}
.top-actions{display:flex;gap:8px;align-items:center}
.badge{font-size:12px;border:1px solid var(--line);padding:7px 10px;border-radius:999px;color:var(--muted)}
.layout{display:flex;min-height:calc(100vh - 62px)}
.side{width:232px;background:#102b43;color:#e2edf6;padding:14px 10px;flex:none}
.navlabel{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#8ea5b8;padding:11px}
.nav{width:100%;border:0;background:transparent;color:#e1edf6;border-radius:8px;padding:11px 12px;text-align:left;margin:2px 0}.nav:hover,.nav.active{background:#1b4b72;color:#fff}
.ico{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:9px;stroke:currentColor;fill:none;stroke-width:1.8}
.main{width:100%;max-width:1450px;margin:0 auto;padding:26px}.main.library-main{padding:0!important;margin-top:0!important}.library-page-head{padding:10px 18px 8px;margin:0}.library-page-head h1{margin:0}.library-page-head p{margin:3px 0 0}.main.library-main .lib-layout{margin:0!important;padding:0!important}.main.library-main .lib-side{margin-top:0!important;top:0!important}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}.pagehead h1{margin:0;color:var(--navy);font-size:30px}.pagehead p{margin:6px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:18px}
.title{font-weight:800;color:var(--navy);font-size:18px;margin-bottom:10px}.small{font-size:12px}.muted{color:var(--muted)}
.grid{display:grid;gap:15px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}.danger{background:var(--redbg);color:var(--red);border:1px solid #e8bbb3}
.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:28px;font-weight:800;color:var(--navy);margin-top:3px}
.notice{background:var(--blue2);color:var(--ink);border:1px solid var(--line);padding:12px 14px;border-radius:9px}
.hero{background:linear-gradient(135deg,#102b43,#173e5f);color:#fff;border-radius:14px;padding:24px;display:flex;justify-content:space-between;gap:20px}.hero h2{color:#fff;margin:4px 0 8px;font-size:30px}.hero p{color:#dcebf6;max-width:760px;line-height:1.55}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}.field textarea{min-height:110px;resize:vertical}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 7px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}.table th{color:var(--muted);font-size:12px}
.sourcebox{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;max-height:220px;overflow:auto}.source-row{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:8px;margin-bottom:6px}.source-row input{margin-top:3px}
.image-preview{max-width:420px;max-height:260px;display:block;border:1px solid var(--line);border-radius:8px;margin-top:8px}
.term{font-weight:800;color:var(--navy)}.sup{font-size:10px;vertical-align:super;color:var(--blue)}
.footnotes{border-top:1px solid var(--line);padding-top:14px;margin-top:20px;font-size:12px;color:var(--muted)}
.empty{text-align:center;border:1px dashed var(--line);border-radius:10px;padding:28px;color:var(--muted)}
.qwrap{display:flex;gap:13px}.qnav{width:70px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;height:max-content}.qnum{width:100%;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);margin-bottom:6px}.qnum.active{background:var(--blue);color:#fff;border-color:var(--blue)}.qnum.done{background:var(--greenbg);color:var(--green)}.qnum.marked{box-shadow:inset 4px 0 0 #f3a712;font-weight:800}.qnum.active.marked{box-shadow:inset 4px 0 0 #ffd86b}.ivtg-mark-question.active{font-weight:800;border-color:var(--blue);background:var(--blue2)}
.qcard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}.qtop{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.qbody{padding:22px}.qbody h3{margin:0 0 18px;color:var(--navy);font-size:20px;line-height:1.5}.case{background:var(--bg);border-left:4px solid var(--blue);padding:13px 15px;border-radius:8px;margin-bottom:18px}.case-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--blue);font-weight:800;margin-bottom:5px}
.answer{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:13px;margin:8px 0}.answer.selected{background:var(--blue2);border-color:var(--blue)}.answer.correct{background:var(--greenbg);border-color:#9fd3b2}.answer.wrong{background:var(--redbg);border-color:#e7aaa1}
.explain{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}.question-explanation-rich{line-height:1.7}.question-explanation-rich p{margin:10px 0}.question-explanation-rich table{width:100%;border-collapse:collapse;margin:12px 0}.question-explanation-rich th,.question-explanation-rich td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}.question-explanation-rich th{background:var(--bg);font-weight:700}.box{padding:11px;border:1px solid var(--line);border-radius:8px;margin-top:8px}.good{background:var(--greenbg)}
.bottom{background:var(--bg);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.lib-layout{display:flex;gap:14px;align-items:flex-start;margin-top:0}.lib-side{width:270px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px;height:max-content;position:sticky;top:0;max-height:calc(100vh - 88px);overflow:auto;box-sizing:border-box}.lib-side button{display:block;width:100%;padding:9px 10px;text-align:left;border:0;background:transparent;color:var(--ink);border-radius:7px}.lib-side button.active{background:var(--blue2);color:var(--blue);font-weight:700}
.lib-section-toggle{display:flex!important;align-items:center;justify-content:space-between;font-weight:700!important;color:var(--ink)!important;background:transparent!important;border:0;text-align:left}
.lib-section-toggle:hover{background:var(--blue2)!important}
.lib-section-items{display:block}
.lib-section-chevron{font-size:16px;color:var(--muted);margin-left:8px}.lib-article{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:25px;line-height:1.75;min-width:0}.lib-article h2{color:var(--navy);margin:0}.article-toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.article-content p{margin:10px 0}.article-content img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.article-rich-editor{min-height:320px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:12px;line-height:1.7;overflow:auto}.article-rich-editor table,.article-content table{width:100%;border-collapse:collapse;margin:12px 0}.article-rich-editor th,.article-rich-editor td,.article-content th,.article-content td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}.article-rich-editor th,.article-content th{background:var(--bg);font-weight:700}.article-rich-editor ul,.article-rich-editor ol,.article-content ul,.article-content ol{padding-left:24px}.article-rich-editor:focus{outline:2px solid var(--blue);outline-offset:-2px}.inline-image-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px}.inline-image-tools>.small{flex:1 1 100%}.inline-image-sizebar{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card)}.inline-image-sizebar input{width:170px}.inline-image-editor{display:inline-flex;vertical-align:middle;align-items:center;gap:3px;margin:2px 3px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--bg);cursor:grab;user-select:none}.inline-image-editor img{display:block;max-width:180px;max-height:130px;border-radius:5px;pointer-events:none}.inline-image-editor-broken{color:var(--red);font-weight:700}
.inline-image-live{display:inline-block;color:var(--blue);font-weight:700}.inline-image-label{display:inline;color:var(--blue);cursor:pointer;text-decoration:underline dotted}.inline-image-live-preview{display:block;margin-top:7px;max-width:420px;max-height:340px;width:auto;height:auto;border-radius:7px;border:1px solid var(--line);cursor:pointer}.inline-image-trigger:hover{opacity:.8}
.search{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:10px;margin:9px 0}
.floating-mark{position:fixed;z-index:900;display:none;background:#18222b;color:#fff;border-radius:8px;padding:6px 8px;gap:5px;align-items:center;box-shadow:0 7px 18px rgba(0,0,0,.25)}.floating-mark:before{content:"Markeren";font-size:12px;font-weight:700;margin:0 4px 0 2px}.mark-dot{width:22px;height:22px;border-radius:5px;border:0}.mark-remove{background:#2b2f33;color:#fff;border:0}.yellow{background:#ffe93f}.green{background:#a6ef4b}.cyan{background:#65e3ea}.pink{background:#eaa6c8}.orange{background:#f7ac3f}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:min(850px,100%);max-height:88vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:12px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ivtg{min-height:100vh;background:#e3e9f0;color:#102b43}.ivtg.dark-bg{background:#0d1822;color:#eef3f7}.ivtg-top{height:58px;background:#174f7e;color:#fff;display:flex;align-items:center;padding:0 10px;gap:10px}.ivtg-item{background:transparent;border:0;color:#fff;font-size:12px;min-width:70px}.ivtg-item svg{display:block;width:21px;height:21px;margin:0 auto 3px;stroke:currentColor;fill:none;stroke-width:1.8}.ivtg-tools{display:flex;align-items:center;gap:10px;flex:1;justify-content:center}.ivtg-count{font-weight:800;background:#104268;padding:8px 10px}.ivtg-left{position:fixed;left:0;top:58px;bottom:52px;width:110px;background:#fff;border-right:1px solid #c7d1da;overflow:auto}.ivtg-main{margin-left:110px;padding:18px 24px 70px;background:#f0f3f7;min-height:calc(100vh - 110px)}.ivtg-question{max-width:1100px;margin:auto;background:#f8fafc;padding:18px 28px;min-height:calc(100vh - 150px)}.ivtg.dark .ivtg-main{background:#101b26}.ivtg.dark .ivtg-question{background:#14222e;color:#fff}.ivtg.dark .ivtg-left{background:#121f2b;border-color:#33495b}.ivtg.dark .ivtg-question .qcard{background:#15232f;color:#fff;border-color:#33495b}.ivtg.dark .ivtg-question .qbody,.ivtg.dark .ivtg-question .qbody h3,.ivtg.dark .ivtg-question .case{color:#fff}.ivtg.dark .ivtg-question .answer{background:#172835;color:#fff;border-color:#3b5265}.ivtg.dark .ivtg-question .answer.correct{background:#16422c}.ivtg.dark .ivtg-question .answer.wrong{background:#451d1a}.ivtg.dark .ivtg-question .box,.ivtg.dark .ivtg-question .case{background:#0f1d28}.ivtg.dark .ivtg-question .muted{color:#bac8d2}.ivtg-bottom{position:fixed;left:0;right:0;bottom:0;height:52px;background:#174f7e;color:#fff;display:flex;justify-content:flex-end;gap:12px;align-items:center;padding:0 12px;z-index:100}.ivtg-status{height:26px;width:100%;border:0;border-bottom:1px solid #cbd5de;background:#fff}.ivtg-status.active{background:#174f7e;color:#fff}.ivtg-status.done{background:#e2f2e8}
.tutorial-list{display:grid;gap:10px}.tutorial-step{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}.tutorial-step p{margin:5px 0 0;color:var(--muted);line-height:1.5}
.calculator-modal{width:min(390px,100%);background:var(--card);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.calculator{margin-top:6px}.calculator-display{height:74px;border-radius:10px;background:#111820;color:#fff;font-size:34px;display:flex;justify-content:flex-end;align-items:center;padding:0 16px;overflow:hidden;font-variant-numeric:tabular-nums}.calculator-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.calculator-key{height:58px;border:0;border-radius:10px;background:var(--bg);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer}.calculator-key:hover{filter:brightness(.98)}.calculator-key.operator{background:var(--blue);color:#fff}.calculator-key.utility{background:#e7eaed}.calculator-key:nth-last-child(3){grid-column:span 2}
.lab-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.lab-tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 10px;border-radius:7px}.lab-tab.active{background:var(--blue);color:#fff}.lab-search{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin-bottom:10px}.lab-table{width:100%;border-collapse:collapse}.lab-table th,.lab-table td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.lab-table th{font-size:12px;color:var(--muted)}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.hero{display:block}.mock{width:100%;margin-top:14px}.ivtg-left{width:70px}.ivtg-main{margin-left:70px}}
@media(max-width:720px){.main{padding:15px}.g2,.g3,.g4{grid-template-columns:1fr}.layout{display:block}.side{width:100%;min-height:0;display:flex;overflow:auto}.navlabel{display:none}.qwrap,.lib-layout{display:block}.qnav,.lib-side{width:100%;position:static;margin-bottom:12px}.qnum{width:40px;margin-right:4px}.ivtg-left{width:44px}.ivtg-main{margin-left:44px;padding:8px}.ivtg-tools{gap:4px}.ivtg-item{min-width:54px;font-size:10px}.ivtg-question{padding:10px}}
/* Force readable dark-mode text */
body.dark,body.dark .main,body.dark .card,body.dark .pagehead,body.dark .pagehead p,
body.dark .qbody,body.dark .qbody h3,body.dark .qtop,body.dark .article-content,
body.dark .lib-article,body.dark .lib-article h2,body.dark .title,
body.dark .field label,body.dark .row,body.dark .stat .label,body.dark .stat .value{color:var(--ink)}
body.dark .article-content p,body.dark .article-content li,body.dark .qbody p{color:#f3f6f8}
body.dark .term{color:#fff}

/* v9: iVTG side panels + chapter timer */
.ivtg-shell{position:relative;min-height:100vh}
.ivtg-drawer{position:fixed;top:58px;right:0;bottom:52px;width:min(720px,62vw);background:var(--card);color:var(--ink);z-index:180;border-left:1px solid var(--line);box-shadow:-8px 0 22px rgba(0,0,0,.18);display:flex;flex-direction:column}
.ivtg-drawer-head{height:50px;background:#174f7e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex:none}
.ivtg-drawer-body{display:flex;min-height:0;flex:1}
.ivtg-drawer-side{width:245px;border-right:1px solid var(--line);background:var(--bg);overflow:auto;padding:12px}
.ivtg-drawer-side .drawer-search{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);margin-bottom:9px}
.ivtg-drawer-side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:8px 9px;border-radius:7px}
.ivtg-drawer-side button.active{background:var(--blue2);color:var(--blue);font-weight:700}
.ivtg-drawer-content{flex:1;overflow:auto;padding:22px}
.ivtg-drawer-content h2{margin:0;color:var(--navy);font-size:27px}
.ivtg-drawer-content h3{color:var(--navy);font-size:16px;margin:22px 0 7px;border-bottom:1px solid var(--line);padding-bottom:6px}
.ivtg-drawer-content p{line-height:1.7;color:var(--ink)}
body.dark .ivtg-drawer,body.dark .ivtg-drawer-content p,body.dark .ivtg-drawer-content h2,body.dark .ivtg-drawer-content h3{color:#fff}
body.dark .ivtg-drawer-side{background:#111e29}
body.dark .ivtg-drawer-side button{color:#f0f4f7}
.ivtg-note-panel{position:fixed;top:58px;right:0;bottom:52px;width:min(820px,66vw);background:var(--card);color:var(--ink);z-index:180;border-left:1px solid var(--line);box-shadow:-8px 0 22px rgba(0,0,0,.18);display:flex;flex-direction:column}
.ivtg-note-head{height:50px;background:#dfe1e3;color:#1d2a34;display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex:none}
.ivtg-note-body{display:flex;min-height:0;flex:1}
.ivtg-note-list{width:245px;background:#f3f4f6;border-right:1px solid #d5d9dd;padding:10px;overflow:auto}
.ivtg-note-list button{width:100%;text-align:left;border:0;background:transparent;padding:9px;border-radius:6px;color:#26333d}
.ivtg-note-list button.active{background:#fff;border:1px solid #d5d9dd}
.ivtg-note-editor{flex:1;padding:20px;display:flex;flex-direction:column}
.ivtg-note-editor input{font-size:23px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:4px 0 10px;margin-bottom:10px}
.ivtg-note-editor textarea{flex:1;min-height:280px;resize:none;border:0;outline:0;background:var(--card);color:var(--ink);font-size:15px;line-height:1.65}
.ivtg-time{margin-right:auto;padding-left:10px;font-size:12px;font-weight:700}
body.dark .ivtg-note-head{background:#26343f;color:#f4f7f9}
body.dark .ivtg-note-list{background:#101a23;border-color:#324555}
body.dark .ivtg-note-list button{color:#e8eef2}
body.dark .ivtg-note-list button.active{background:#1d2a35;border-color:#3a4f60}
@media(max-width:900px){
  .ivtg-drawer,.ivtg-note-panel{width:calc(100vw - 44px)}
  .ivtg-drawer-side,.ivtg-note-list{width:185px}
}
@media(max-width:650px){
  .ivtg-drawer,.ivtg-note-panel{width:100vw}
  .ivtg-drawer-side,.ivtg-note-list{width:160px}
}


.qnavtree{margin:2px 0 8px 10px;border-left:1px solid #406079;padding-left:8px}
.qnavtree .subnav{display:block;width:100%;border:0;background:transparent;color:#b9c9d7;text-align:left;padding:8px 8px;border-radius:6px;font-size:13px}
.qnavtree .subnav:hover,.qnavtree .subnav.active{background:#1b4b72;color:#fff}
.qnavtree .subnav.section{color:#e3edf5;font-weight:700}
.perf-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.perf-tab{border:0;background:transparent;color:var(--muted);padding:11px 15px;border-bottom:2px solid transparent}
.perf-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.perf-table{width:100%;border-collapse:collapse}
.perf-table th,.perf-table td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
.perf-table th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.perf-bar{height:8px;border-radius:99px;background:#e8edf2;overflow:hidden;min-width:120px}
.perf-bar>span{display:block;height:100%;background:#57bf67}
.ring{width:156px;height:156px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(#57bf67 var(--p),#f0c9c6 0);position:relative}
.ring:after{content:"";width:116px;height:116px;background:var(--card);border-radius:50%;position:absolute}
.ring .ringtext{position:relative;z-index:2;text-align:center;color:var(--navy);font-weight:800}
.metric-list .row{padding:13px 0}
.search-results .result{padding:12px;border-bottom:1px solid var(--line)}

<script>
(function(){
  var PASSWORD='Chanel';
  var gate=document.getElementById('accessGate');
  var form=document.getElementById('accessForm');
  var input=document.getElementById('accessPassword');
  var error=document.getElementById('accessError');
  function unlock(){
    document.body.classList.remove('gate-locked');
    document.body.classList.add('gate-unlocked');
    try{sessionStorage.setItem('medqnl_access','1')}catch(e){}
    if(input) input.value='';
    if(error) error.textContent='';
    try{
      var app=document.getElementById('app');
      if(app) app.style.display='block';
      if(typeof window.__medqnlBoot==='function') window.__medqnlBoot();

        try{
          if(app && !app.innerHTML.trim() && typeof window.__medqnlBoot==='function') window.__medqnlBoot();
        }catch(e){}
      },50);
    }catch(e){}
  }
  var unlocked=false;
  try{unlocked=sessionStorage.getItem('medqnl_access')==='1'}catch(e){}
  if(unlocked) unlock();
  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(input.value===PASSWORD){unlock();}
    else{error.textContent='Onjuist wachtwoord.';input.value='';input.focus();}
  });
})();

{id:"q1",subject:"Metamedica",topic:"Medische ethiek",difficulty:"Makkelijk",title:"Niet-schaden",caseText:"Een arts overweegt een invasieve ingreep met een zeer kleine kans op voordeel en een reële kans op ernstige complicaties.",stem:"Welk principe is hier het meest direct relevant?",options:["Niet-schaden","Alleen autonomie","Alleen vertrouwelijkheid","Beschrijvende ethiek","Meta-ethiek"],correct:0,explanation:"Het principe van **niet-schaden** vraagt aandacht voor het vermijden van onnodige of disproportionele schade. Ook **proportionaliteit** is relevant.",objective:"Niet-schaden en proportionaliteit toepassen.",sourceIds:["s7"],image:""},
{id:"q2",subject:"Metamedica",topic:"WGBO",difficulty:"Gemiddeld",title:"13-jarige patiënt",caseText:"Een 13-jarige wilsbekwame patiënt heeft een reguliere medische behandeling nodig. De patiënt en de ouders zijn beiden betrokken bij de beslissing.",stem:"Welke regel past in beginsel bij de WGBO?",options:["Alleen de arts beslist.","Alleen de ouders beslissen.","De jongere en de ouder(s)/voogd hebben in beginsel beide een rol in de toestemming.","De burgemeester beslist.","Niemand hoeft toestemming te geven."],correct:2,explanation:"Tussen **12 en 16 jaar** geldt in beginsel een vorm van dubbele toestemming: de jongere en de ouder(s) of voogd met gezag hebben beide een rol.",objective:"De WGBO-leeftijdsregeling voor 12- tot 16-jarigen kennen.",sourceIds:["s1","s2"],image:""},
{id:"q3",subject:"Metamedica",topic:"Laboratoriuminterpretatie",difficulty:"Makkelijk",title:"Hyponatriëmie",caseText:"Een 72-jarige patiënt gebruikt een diureticum en is sinds twee dagen misselijk en suf. Het serum-natrium is 124 mmol/L.",stem:"Welke labafwijking is duidelijk aanwezig?",options:["Hypernatriëmie","Hyponatriëmie","Hyperkaliëmie","Hypocalciëmie","Hyperchloremie"],correct:1,explanation:"Een natriumwaarde van **124 mmol/L** ligt onder de gebruikelijke volwassen referentiewaarde en past bij **hyponatriëmie**.",objective:"Elektrolytenafwijkingen herkennen met behulp van een referentietabel.",sourceIds:["s11","s13"],image:""},

{id:"q9",subject:"Infectieziekten",topic:"Acute bacteriële prostatitis",difficulty:"Moeilijk",title:"Vraag 2: Een man met mictieklachten en koorts",caseText:"Een 62-jarige man presenteert zich op de Spoedeisende Hulp met sinds 24 uur bestaande koude rillingen, een temperatuur van 38,9 °C en spierpijn. Tevens vermeldt hij een hevig branderig gevoel bij het plassen en moeite met het uitplassen. Bij lichte palpatie van de prostaat via rectaal toucher geeft patiënt extreme pijn aan. Bloedonderzoek toont een verhoogd CRP (142 mg/L) en een leukocytose.",stem:"Wat is de meest accurate fysiologische onderbouwing voor de keuze van het antibioticum in deze casus?",options:["De patiënt moet behandeld worden met Nitrofurantoïne, omdat dit de hoogste concentratie in het lumen van de blaas bereikt.","De patiënt moet behandeld worden met Ciprofloxacin, omdat dit middel een goede weefselpenetratie heeft in het prostaatweefsel.","De patiënt moet behandeld worden met Fosfomycine, omdat dit bacteriostatisch werkt tegen grampositieve diplokokken.","De patiënt kan afwachtend worden behandeld zonder antibiotica, mits de urinekweek negatief blijft."],correct:1,explanation:"Klinische interpretatie: Deze patiënt heeft een acute bacteriële prostatitis (tekenen van weefselinvasie/gecompliceerde UWI bij een man met koorts en een pijnlijk rectaal toucher).\n\nWaarom B juist is: Bij weefselinvasie (zoals prostatitis of pyelonefritis) is een middel nodig met een hoge weefselpenetratie. Fluorochinolonen zoals Ciprofloxacin dringen uitstekend door in het prostaatweefsel en zijn daardoor de aangewezen orale behandeling.\n\nWaarom de andere opties onjuist zijn:\nA (Nitrofurantoïne): Dringt nauwelijks door in weefsels (nierparenchym/prostaat) en is dus strikt contra-geïndiceerd bij een gecompliceerde UWI/prostatitis.\nC (Fosfomycine): Biedt eveneens onvoldoende weefselspiegels in de prostaat en heeft een ander werkingsspectrum.\nD (Afwachtend): Een acute prostatitis met systemische verschijnselen vereist direct antibiotische behandeling om urosepsis en abcesvorming te voorkomen.",objective:"Het onderscheid tussen een ongecompliceerde lage UWI en een infectie met weefselinvasie herkennen en antibioticakeuze koppelen aan weefselpenetratie.",sourceIds:["s19"],image:""},

{id:"q10",subject:"Infectieziekten",topic:"Gonorroe",difficulty:"Gemiddeld",title:"Vraag 3: Een jonge man met urethrale afscheiding",caseText:"Een 23-jarige man bezoekt het soa-spreekuur met sinds 4 dagen bestaande overvloedige, geel-groene, purulente afscheiding uit de urethra en mictieklachten. Hij geeft aan twee weken geleden onbeschermd seksueel contact te hebben gehad. Microscopisch onderzoek van een grampreparaat van de afscheiding toont gramnegatieve diplokokken binnenin de polymorfnucleaire leukocyten (intracellulair).",stem:"Wat is de meest geschikte initiële behandeling voor deze aandoening volgens de richtlijnen?",options:["Doxycycline 100 mg 2dd p.o. gedurende 7 dagen","Ceftriaxon 500 mg i.m. eenmalig","Metronidazol 2000 mg p.o. eenmalig","Fluconazol 150 mg p.o. eenmalig"],correct:1,explanation:"Klinische interpretatie: Het klinisch beeld van overvloedige purulente afscheiding gecombineerd met de microscopische bevinding van intracellulaire gramnegatieve diplokokken is bewijzend voor een gonorroe-urethritis (Neisseria gonorrhoeae).\n\nWaarom B juist is: De eerste keus behandeling voor een ongecompliceerde gonokokkeninfectie is een eenmalige intramusculaire injectie met Ceftriaxon 500 mg (of 1000 mg afhankelijk van lokaal protocol).\n\nWaarom de andere opties onjuist zijn:\nA (Doxycycline): Is de eerste keus behandeling voor Chlamydia trachomatis, niet voor gonorroe (vanwege hoge resistentiecijfers van N. gonorrhoeae tegen tetracyclines).\nC (Metronidazol): Is de behandeling voor Trichomonas vaginalis en bacteriële vaginose.\nD (Fluconazol): Is een antimycoticum gebruikt voor schimmelinfecties (bijv. Candida).",objective:"Gonorroïsche urethritis herkennen aan het klinische beeld en intracellulaire gramnegatieve diplokokken en de eerste keus antibioticum kennen.",sourceIds:["s27"],image:""}

var ARTICLES=[
{id:"a1",sectionId:"sec1",title:"Metamedica — overzicht",body:["Metamedica onderzoekt de verhouding tussen geneeskunde, mens, waarden, samenleving en recht.","De kern bestaat uit *ethiek*, *medische ethiek*, de *WGBO*, het *beroepsgeheim*, het *medisch dossier* en *verplichte geestelijke gezondheidszorg*."],sourceIds:["s5","s10"],image:""},
{id:"a2",sectionId:"sec1",title:"Normen, waarden en ethiek",body:["Een *waarde* is iets wat iemand of een gemeenschap belangrijk vindt. Een *norm* is een regel of verwachting die richting geeft aan gedrag.","*Beschrijvende ethiek* brengt bestaande normen en waarden in kaart. *Normatieve ethiek* vraagt wat moreel gerechtvaardigd is. *Meta-ethiek* onderzoekt de betekenis en status van morele begrippen."],sourceIds:["s5","s10"],image:""},
{id:"a3",sectionId:"sec1",title:"WGBO en toestemming",body:["De *WGBO* bevat belangrijke regels over de geneeskundige behandelingsovereenkomst. *Informed consent* betekent dat een patiënt relevante informatie krijgt en vrijwillig kan beslissen.","*Wilsbekwaamheid* is besluitgebonden. De vraag is of de patiënt de informatie kan begrijpen, gevolgen kan waarderen, opties kan afwegen en een keuze kan uiten."],sourceIds:["s1","s2"],image:""},
{id:"a4",sectionId:"sec1",title:"Beroepsgeheim en dossier",body:["Het *medisch dossier* bevat informatie die voor de behandeling relevant is. De algemene bewaartermijn is minimaal 20 jaar vanaf de laatste wijziging.","Het *beroepsgeheim* beschermt patiëntinformatie tegenover derden. Delen kan bijvoorbeeld op grond van toestemming of een wettelijke uitzondering."],sourceIds:["s3","s9"],image:""},
{id:"a5",sectionId:"sec2",title:"Labwaarden gebruiken",body:["Gebruik deze kaart als *educatieve leerhulp*. Referentie-intervallen kunnen verschillen per laboratorium, methode, leeftijd en geslacht.","Voor patiëntenzorg moet altijd het interval op het eigen laboratoriumrapport worden gebruikt."],sourceIds:["s11","s12","s13"],image:""},
{id:"f1",sectionId:"sec3",title:"Portale circulatie en portale hypertensie",body:[
"De *vena portae* voert bloed vanuit onder andere het maag-darmkanaal en de milt naar de lever. Daarmee vormt de portale circulatie een schakel tussen het spijsverteringsgebied en de lever.",
"Wanneer de vaatweerstand in het portale systeem stijgt, kan *portale hypertensie* ontstaan. Het lichaam probeert die druk deels te omzeilen via collaterale verbindingen tussen het portale en systemische veneuze vaatbed.",
"Belangrijke gevolgen van zulke collateralen zijn *oesofagusvarices*, rectale varices en zichtbare venen rond de navel. Een varixbloeding, vooral uit de slokdarm, kan acuut levensbedreigend zijn.",
"Een behandelingsprincipe is het creëren van een gecontroleerde verbinding tussen portale en systemische circulatie. Een transjugulaire portosystemische shunt heet een *TIPS*.",
"**Toetskoppeling:** denk bij verhoogde portale weerstand aan: hogere portaledruk → vorming van collateralen → risico op varices en andere complicaties."
],sourceIds:["s15"],image:""},

{id:"f2",sectionId:"sec3",title:"Mannelijke voortplantingsfysiologie",body:[
"De testis combineert endocriene functie met de productie van gameten. *Leydigcellen* maken testosteron onder invloed van LH. *Sertolicellen* ondersteunen de ontwikkeling van kiemcellen en de spermatogenese; FSH is hierbij belangrijk.",
"De regeling verloopt via de *hypothalamus-hypofyse-gonade-as*. Pulsgewijze GnRH-afgifte stimuleert de hypofyse tot secretie van LH en FSH. Gonadale hormonen zorgen vervolgens voor negatieve terugkoppeling.",
"Sertolicellen produceren onder andere *inhibine B*. Tijdens de embryonale ontwikkeling speelt *AMH* uit Sertolicellen een rol bij het remmen van de Müller-structuren.",
"Bij een typisch mannelijk embryologisch ontwikkelingspad blijft de Wolff-structuur bestaan en vormt deze een groot deel van het interne afvoersysteem van de mannelijke geslachtsorganen. De Müller-structuren regresseren onder invloed van AMH."
],sourceIds:["s14"],image:""},

{id:"f3",sectionId:"sec3",title:"Spermatogenese en hormonale feedback",body:[
"De *spermatogenese* vindt plaats in de seminifere tubuli. Sertolicellen leveren hierbij structurele en metabole ondersteuning aan ontwikkelende kiemcellen.",
"De kern van de hormonale koppeling is eenvoudig te onthouden: *LH → Leydig → testosteron* en *FSH → Sertoli → ondersteuning van spermatogenese*. Testosteron en inhibine B leveren negatieve feedback aan de hypothalamus-hypofyse-as.",
"Bij vragen over mannelijke voortplantingsfysiologie is het nuttig eerst de betrokken cel te benoemen en pas daarna het hormoon en de functie te koppelen."
],sourceIds:["s14"],image:""},

{id:"m1",sectionId:"sec4",title:"Basale virologie",body:[
"Virussen zijn afhankelijk van gastheercellen voor hun replicatie. Bij de indeling spelen onder andere het *genoom*, de eiwitmantel en het al dan niet aanwezig zijn van een *envelop* een rol.",
"Virale genomen kunnen uit DNA of RNA bestaan. RNA-virussen kunnen onder meer verschillen in positieve en negatieve polariteit. Deze eigenschappen beïnvloeden hoe het virus zijn genetische informatie kan gebruiken.",
"Een envelop is een lipidemembraan en is daardoor relatief kwetsbaar voor omstandigheden die membranen verstoren. Dat helpt bij het begrijpen van verschillen in overleving en transmissie tussen virusgroepen.",
"Voor klinische herkenning is het nuttig om virusgroepen te koppelen aan patronen, zoals latentie bij herpesvirussen, respiratoire infecties bij influenzavirussen en vectorgebonden transmissie bij verschillende arbovirussen."
],sourceIds:["s16"],image:""},

{id:"m2",sectionId:"sec4",title:"Basale bacteriologie",body:[
"Bacteriën worden onder meer ingedeeld op celwand, vorm en rangschikking. De Gramkleuring maakt onderscheid tussen *grampositieve* en *gramnegatieve* bacteriën op basis van verschillen in hun celwandstructuur.",
"Grampositieve bacteriën hebben een relatief dikke peptidoglycaanlaag. Gramnegatieve bacteriën hebben minder peptidoglycaan en daarnaast een buitenmembraan met onder andere lipopolysaccharide.",
"Ook de vorm helpt bij herkenning: kokken kunnen in paren, ketens of clusters voorkomen, terwijl staven en spiraalvormige bacteriën andere patronen hebben.",
"Antibiotica grijpen aan op verschillende processen, waaronder celwandsynthese, eiwitsynthese en nucleïnezuursynthese. Resistentie kan bijvoorbeeld ontstaan door geneesmiddelen af te breken of het aangrijpingspunt te veranderen."
],sourceIds:["s16"],image:""},

{id:"m3",sectionId:"sec4",title:"Luchtweginfecties",body:[
"Luchtweginfecties worden praktisch verdeeld in aandoeningen van de bovenste en onderste luchtwegen. Bij pneumonie is het belangrijk om de setting van ontstaan mee te nemen, bijvoorbeeld buiten of tijdens een ziekenhuisopname.",
"Bij een patiënt met koorts, hoest en dyspneu helpen tijdsbeloop, risicofactoren, auscultatie en eventueel beeldvorming bij het ordenen van de differentiaaldiagnose.",
"Blootstelling kan richting geven. Contact met vogels, bepaalde dieren, reizen of verminderde afweer kan specifieke verwekkers waarschijnlijker maken.",
"**Toetskoppeling:** leer niet alleen een verwekker, maar de combinatie *verwekker + blootstelling + klinisch beeld + passende diagnostiek*."
],sourceIds:["s16"],image:""},

{id:"m4",sectionId:"sec4",title:"Urogenitale infecties en soa's",body:[
"Bij een *cystitis* staan klachten van de blaas op de voorgrond. Bij *pyelonefritis* is er sprake van betrokkenheid van het nierweefsel, vaak met koorts en flankpijn.",
"Een nitriettest kan de waarschijnlijkheid van een bacteriële urineweginfectie verhogen, maar een negatieve uitslag sluit de diagnose niet altijd uit. Leeftijd, geslacht, zwangerschap, kathetergebruik en systemische verschijnselen beïnvloeden de aanpak.",
"Bij soa's passen verschillende klinische syndromen bij verschillende verwekkers. Chlamydia en gonokokken kunnen urethritis veroorzaken; herpes simplex veroorzaakt typisch pijnlijke vesikels; syfilis kent karakteristieke stadia.",
"*PID* is een opstijgende infectie van de vrouwelijke voortplantingsorganen en kan op termijn schade aan eileiders en vruchtbaarheid veroorzaken."
],sourceIds:["s19","s16"],image:""},

{id:"m5",sectionId:"sec4",title:"Gastro-intestinale infecties",body:[
"Acute diarree kan viraal, bacterieel of parasitair zijn. Het onderscheid tussen *waterige* en *bloederige* diarree helpt bij de eerste differentiaaldiagnose.",
"*Clostridioides difficile* is vooral relevant wanneer de normale darmflora is verstoord, bijvoorbeeld na antibiotica. Een ernstige infectie kan leiden tot pseudomembraneuze colitis.",
"Bij bloederige diarree is *STEC/EHEC* een belangrijke differentiaal. Shigatoxine kan bijdragen aan het *hemolytisch-uremisch syndroom*, met hemolyse, trombocytopenie en nierschade.",
"Reisgeschiedenis, voedselblootstelling, leeftijd en immuunstatus helpen om virale, bacteriële en parasitaire oorzaken verder te onderscheiden."
],sourceIds:["s16"],image:""},

{id:"m6",sectionId:"sec4",title:"Infecties van het zenuwstelsel",body:[
"*Meningitis* is een ontsteking van de hersenvliezen. Liquoronderzoek ondersteunt het onderscheid tussen bacteriële en virale oorzaken. Celtype, eiwit, glucose en het macroscopische aspect moeten in samenhang worden beoordeeld.",
"Bij een typische bacteriële meningitis zijn neutrofielen en eiwit verhoogd en kan glucose dalen. Bij virale meningitis overheersen vaker lymfocyten en blijft glucose meestal behouden.",
"*Encefalitis* betreft het hersenparenchym. Veranderingen in bewustzijn, gedrag en persoonlijkheid kunnen naast neurologische uitval optreden.",
"*Guillain-Barré* is geen primaire infectie van het zenuwstelsel, maar een immuungemedieerde postinfectieuze neuropathie. Een opstijgende slappe parese en areflexie zijn kenmerkend."
],sourceIds:["s16"],image:""},

{id:"m7",sectionId:"sec4",title:"Vaccinaties en infectiepreventie",body:[
"Het Nederlandse vaccinatiebeleid verandert in de tijd. Voor actuele examenvragen over het *Rijksvaccinatieprogramma* moet daarom steeds de meest recente informatie van het RIVM worden gebruikt.",
"Vaccinaties beschermen tegen meerdere ernstige infectieziekten. Het programma kent verschillende leeftijdsmomenten en aparte aanbevelingen voor specifieke groepen.",
"Voor de iVTG is het nuttig om drie dingen uit elkaar te houden: de ziekte die je voorkomt, de doelgroep die wordt gevaccineerd en het actuele Nederlandse schema.",
"De kern van infectiepreventie blijft breder dan vaccinatie alleen: broncontrole, transmissieroutes, hygiënische maatregelen en tijdige herkenning van besmettelijke ziekte spelen eveneens een rol."
],sourceIds:["s17","s18"],image:""},

{id:"m8",sectionId:"sec4",title:"Koppeling: verwekker, syndroom en context",body:[
"Een sterke microbiologiekennis bestaat uit drie niveaus. Eerst herken je het *syndroom* — bijvoorbeeld urethritis, meningitis of waterige diarree. Daarna koppel je de meest waarschijnlijke *verwekker*. Ten slotte voeg je de *context* toe, zoals leeftijd, reis, immuunstatus, blootstelling of antibioticagebruik.",
"Deze aanpak voorkomt dat microbiologie alleen een lijst met losse organismen wordt. Dezelfde verwekker kan bovendien verschillende beelden geven afhankelijk van de gastheer en de plaats van infectie.",
"**Toetsstrategie:** begin bij het klinische beeld en ga pas daarna naar de verwekker. Vraag jezelf vervolgens af welke bevinding de keuze het sterkst ondersteunt."
],sourceIds:["s16"],image:""},
{id:"f0",sectionId:"sec3",title:"Fysiologie — overzicht",body:[
"Dit hoofdstuk bundelt de belangrijkste fysiologische leerprincipes. Gebruik de subsecties links om snel naar een onderwerp te gaan.",
"De onderdelen zijn *hart en vaatstelsel*, *ademhalingsstelsel*, *nieren en urinewegen*, *hemostase*, *bloed en lymfe*, *zenuwstelsel*, *hormonen en metabolisme*, *spijsverteringsstelsel* en *voortplantingsstelsel*.",
"Bij fysiologievragen helpt een vaste redeneerstap: bepaal welke variabele verandert, identificeer het regelsysteem en voorspel daarna het effect."
],sourceIds:["s20","s21","s22","s23","s24","s25","s26"],image:""},

{id:"f4",sectionId:"sec3",title:"Hart en vaatstelsel",body:[
"*S1* ontstaat door het sluiten van de atrioventriculaire kleppen en hoort bij het begin van de systole. *S2* ontstaat door het sluiten van de aorta- en pulmonalisklep en hoort bij het begin van de diastole.",
"*Polsdruk* is het verschil tussen systolische en diastolische bloeddruk. Een stijve aorta kan de polsdruk vergroten.",
"De *mean arterial pressure (MAP)* kan bij een normale hartfrequentie worden benaderd met: MAP ≈ (SBD + 2 × DBD) / 3.",
"Bij een plotselinge bloeddrukdaling neemt de baroreceptoractiviteit af. De sympathische respons verhoogt onder andere hartfrequentie, contractiliteit en perifere vaatweerstand.",
"*Compliance* beschrijft de volumeverandering bij een drukverandering. Venen zijn zeer compliant en vormen daardoor een bloedreservoir.",
"Volgens het Poiseuille-principe heeft de vaatstraal een zeer sterke invloed op de weerstand tegen stroming."
],sourceIds:["s20"],image:""},

{id:"f5",sectionId:"sec3",title:"Ademhalingsstelsel",body:[
"De vier basisvolumes zijn *teugvolume (TV)*, *inspiratoir reservevolume (IRV)*, *expiratoir reservevolume (ERV)* en *residuaal volume (RV)*.",
"Belangrijke capaciteiten zijn: *vitale capaciteit = IRV + TV + ERV*, *inspiratoire capaciteit = TV + IRV*, *functionele residuele capaciteit = RV + ERV* en *totale longcapaciteit = IRV + TV + ERV + RV*.",
"Type I-pneumocyten vormen het belangrijkste gaswisselingsoppervlak. Type II-pneumocyten produceren *surfactant*, waarmee de oppervlaktespanning in alveoli wordt verlaagd.",
"De *V/Q-verhouding* verschilt regionaal binnen de long. In rechtopstaande houding is de perfusie naar de basis relatief groter.",
"Sympathische β2-stimulatie bevordert bronchodilatatie; parasympathische muscarinereceptoractiviteit bevordert bronchoconstrictie."
],sourceIds:["s21"],image:""},

{id:"f6",sectionId:"sec3",title:"Nieren en urinewegen",body:[
"De *glomerulaire filtratiesnelheid (GFR)* hangt samen met de netto filtratiedruk en de eigenschappen van de glomerulaire filtratiebarrière.",
"Dilatatie van de afferente arteriole vergroot doorgaans de renale bloedtoevoer en ondersteunt een hogere GFR. De efferente arteriole heeft een belangrijke invloed op de glomerulaire druk.",
"Bij lage renale perfusie kan het *renine-angiotensine-aldosteronsysteem (RAAS)* worden geactiveerd. Renine start een cascade die leidt tot *angiotensine II* en aldosteron.",
"Aldosteron bevordert natriumreabsorptie in het distale nefron, waardoor waterretentie en kaliumuitscheiding toenemen.",
"NSAID's remmen prostaglandinesynthese en kunnen daardoor de renale perfusie verminderen bij kwetsbare patiënten."
],sourceIds:["s22"],image:""},

{id:"f7",sectionId:"sec3",title:"Hemostase",body:[
"Na vaatbeschadiging verlopen *primaire hemostase*, *secundaire hemostase* en fibrinolyse functioneel na elkaar.",
"Tijdens de primaire fase worden trombocyten geactiveerd. *Von Willebrandfactor* ondersteunt de adhesie aan beschadigd subendotheel en daarna ontstaat aggregatie.",
"Tijdens de secundaire fase leidt de stollingscascade uiteindelijk tot *trombine*. Trombine zet fibrinogeen om in *fibrine*, dat de primaire plaatjesplug stabiliseert.",
"Antitrombine, actief proteïne C en TFPI beperken de stollingsreactie. Bij fibrinolyse wordt plasminogeen omgezet in *plasmin*, dat fibrine afbreekt."
],sourceIds:["s26"],image:""},

{id:"f8",sectionId:"sec3",title:"Bloed en lymfe",body:[
"Het meeste lichaamswater bevindt zich intracellulair. Het extracellulaire compartiment bestaat vooral uit interstitieel vocht en intravasculair volume.",
"Een hypertonische vloeistof trekt water uit cellen; een hypotone vloeistof kan water de cellen in verplaatsen. De richting van waterverplaatsing wordt bepaald door de effectieve osmolariteit.",
"De *Starling-krachten* beschrijven de balans tussen hydrostatische en colloïd-osmotische krachten over de capillaire wand.",
"Het *lymfestelsel* voert een deel van het interstitiële vocht terug naar de veneuze circulatie. De ductus thoracicus is hiervoor een belangrijk verzamelvat."
],sourceIds:["s20"],image:""},

{id:"f9",sectionId:"sec3",title:"Zenuwstelsel",body:[
"Het rustmembraanpotentiaal van een neuron is negatief. De *Na+/K+-ATPase* helpt de ionengradiënten onderhouden die nodig zijn voor prikkelgeleiding.",
"Tijdens een actiepotentiaal veroorzaken Na+-instroom en daarna K+-efflux respectievelijk depolarisatie en repolarisatie.",
"*EPSP's* vergroten de kans op een actiepotentiaal, terwijl *IPSP's* die kans verkleinen. De som van synaptische input wordt rond de axonheuvel geïntegreerd.",
"De sterkte van een zenuwprikkel wordt vooral gecodeerd door de frequentie van actiepotentialen en niet door een grotere amplitude van een individueel actiepotentiaal.",
"Sympathische en parasympathische activiteit hebben vaak tegengestelde effecten op hart, luchtwegen, pupil, maag-darmkanaal en urineblaas."
],sourceIds:["s23"],image:""},

{id:"f10",sectionId:"sec3",title:"Hormonen en metabolisme",body:[
"De calciumhuishouding wordt onder andere gereguleerd door *PTH*, calcitriol en calcitonine. PTH stijgt bij een lage calciumconcentratie.",
"*Insuline* wordt uitgescheiden door β-cellen van de pancreas. Het stimuleert onder andere GLUT4-gemedieerde glucoseopname in spier- en vetweefsel.",
"*Glucagon* helpt bij een lage energiebeschikbaarheid de glucosevoorziening in stand te houden.",
"Bij lipidenmetabolisme vervoeren lipoproteïnen triglyceriden en cholesterol tussen darm, lever en perifere weefsels. *LDL* levert cholesterol aan weefsels; *HDL* ondersteunt transport terug richting lever.",
"Bij een hormooncasus is de snelste redeneerlijn vaak: broncel → hormoon → doelcel → effect → terugkoppeling."
],sourceIds:["s24"],image:""},

{id:"f11",sectionId:"sec3",title:"Spijsverteringsstelsel",body:[
"De opname van voedingsstoffen verschilt per segment van het maag-darmkanaal. Het duodenum is belangrijk voor vroege opnameprocessen, het jejunum voor veel macronutriënten en het terminale ileum voor onder andere galzuren en vitamine B12.",
"*Heemijzer* wordt relatief efficiënt opgenomen. Niet-heemijzer wordt beïnvloed door de chemische omgeving; vitamine C ondersteunt de opname.",
"*Vitamine B12* wordt in het terminale ileum opgenomen wanneer het aan intrinsic factor is gebonden.",
"De *enterohepatische kringloop* hergebruikt galzuren. Verlies van galzuren kan de vetabsorptie beïnvloeden.",
"Koolhydraten, eiwitten en vetten moeten eerst enzymatisch worden afgebroken tot opneembare bouwstenen."
],sourceIds:["s25"],image:""},

{id:"f12",sectionId:"sec3",title:"Voortplantingsstelsel",body:[
"*Leydigcellen* produceren testosteron onder invloed van LH. *Sertolicellen* ondersteunen de spermatogenese en worden vooral door FSH gereguleerd.",
"Tijdens mannelijke embryonale ontwikkeling draagt AMH uit Sertolicellen bij aan regressie van de Müller-structuren. Androgenen ondersteunen de ontwikkeling van Wolff-structuren.",
"De hypothalamus-hypofyse-gonade-as wordt door negatieve feedback vanuit de gonaden gereguleerd.",
"Voor toetsvragen helpt de vaste koppeling: hormoon → doelcel → effect."
],sourceIds:["s14"],image:""},

{id:"f13",sectionId:"sec3",title:"Klinische fysiologie — mechanisme naar casus",body:[
"Veel fysiologievragen zijn ketenvragen. Een bloeddrukdaling kan bijvoorbeeld de baroreflex activeren; een verminderde renale perfusie kan het RAAS activeren; een verandering in osmolariteit kan water tussen compartimenten verschuiven.",
"Formules en vaste relaties zijn nuttig bij MAP, longcapaciteiten, GFR en vaatweerstand.",
"**Toetsstrategie:** identificeer eerst de primaire verandering, benoem het regelsysteem en bepaal daarna het uiteindelijke fysiologische en klinische effect."
],sourceIds:["s20","s21","s22","s24"],image:""}
];

{id:"med-approach",library:"medical",sectionId:MEDICAL_SECTION3_ID,title:"Aanpak van de orgaansystemen",body:[
"## Hoe leer je Section III geïntegreerd?",
"Section III is opgebouwd rond grote orgaansystemen. Per systeem worden embryologie, anatomie, fysiologie, pathologie en farmacologie met elkaar verbonden. Het doel is niet losse feiten leren, maar klinische verbanden herkennen.",
"## Embryologie en anatomie",
"Gebruik embryologie om aangeboren afwijkingen te verklaren en koppel anatomie aan beeldvorming, procedures en klinische uitval. Denk steeds: welke structuur is betrokken en waarom geeft dat precies dit klinische beeld?",
"## Fysiologie",
"Benader fysiologie als oorzaak-gevolgketen. Begrijp kernrelaties, grafieken en eenvoudige berekeningen en verbind normale fysiologie met de veranderingen die ontstaan bij ziekte.",
"## Pathologie",
"Begin bij de normale functie en zoek vervolgens de afwijking. Leer herkenningspunten van belangrijke aandoeningen, typische klinische presentaties en de onderscheidende bevindingen die helpen bij de differentiaaldiagnose.",
"## Farmacologie",
"Leer geneesmiddelen vooral via klasse, werkingsmechanisme, klinische toepassing en belangrijke bijwerkingen. Koppel farmacologie steeds terug aan de fysiologie van het betreffende orgaansysteem."
]},
{id:"med-cardio",library:"medical",sectionId:MEDICAL_SECTION3_ID,title:"Cardiovasculair",body:[
"## Kern en focus",
"Belangrijke geïntegreerde thema's zijn hartontwikkeling, anatomie, cardiale fysiologie, atherosclerose, hartfalen, ritmestoornissen, kleplijden, ischemische hartziekte en cardiovasculaire farmacologie.",
"## Embryologie",
"De hartbuis ondergaat looping en septatie. Neural-crête-cellen dragen bij aan de vorming van de uitstroomtractus; stoornissen hierbij kunnen conotruncale afwijkingen veroorzaken, waaronder transpositie, tetralogie van Fallot en persisterende truncus.",
"## Anatomie en fysiologie",
"Ken de kamers, kleppen, coronaircirculatie en het geleidingssysteem. Begrijp de cardiale cyclus, preload, afterload, contractiliteit, de Frank-Starling-relatie en de koppeling tussen ECG en elektrische activiteit.",
"## Pathologie",
"Herken verschillen tussen systolische en diastolische dysfunctie. Bestudeer ischemie en infarct, hartfalen, hypertensie, klepafwijkingen en de typische patronen van hartruisen en ritmestoornissen.",
"## Farmacologie",
"Verbind antihypertensiva, anti-angineuze middelen, hartfalenbehandeling, anti-aritmica en antistolling aan hun fysiologische aangrijpingspunt. Let bij middelen met hemodynamische effecten vooral op klinisch relevante bijwerkingen."
]},
{id:"med-endocrine",library:"medical",sectionId:MEDICAL_SECTION3_ID,title:"Endocrinologie",body:[
"## Kern en focus",
"Begin bij de klier, het hormoon en de feedbacklus. Integreer vervolgens endocriene over- en onderproductie, massaleffecten, laboratoriumpatronen en behandeling.",
"## Embryologie en anatomie",
"Belangrijke thema's zijn ontwikkeling van schildklier en hypofyse en de anatomische relaties van endocriene organen. De hypofyse koppelt hypothalamische signalen aan perifere endocriene klieren.",
"## Fysiologie",
"Ken de regulatie van schildklierhormonen, cortisol, aldosteron, groeihormoon, prolactine, insuline, glucagon, PTH, vitamine D en de calcium-fosfaathuishouding.",
"## Pathologie",
"Herken diabetes mellitus, schildklierstoornissen, hypofyseziekten, bijnieraandoeningen en stoornissen van calciumregulatie. Denk steeds in patronen: hormoon hoog of laag, primaire of secundaire oorzaak en passende feedbackverandering.",
"## Farmacologie",
"Ken de belangrijkste geneesmiddelklassen voor diabetes, schildklier, bijnier en bot-mineraalhuishouding. Koppel werkingsmechanisme aan het hormoonsysteem en aan de meest kenmerkende bijwerkingen."
]},
{id:"med-gi",library:"medical",sectionId:MEDICAL_SECTION3_ID,title:"Gastro-intestinaal",body:[
"## Kern en focus",
"Integreer ontwikkeling van het maag-darmkanaal, innervatie, bloedvoorziening, absorptie en de belangrijkste inflammatoire, maligne en obstructieve aandoeningen.",
"## Embryologie",
"Foregut, midgut en hindgut vormen de basisindeling. De darm ondergaat fysiologische herniatie en rotatie rond de arteriële as; afwijkingen kunnen leiden tot malrotatie, herniatie en andere aangeboren problemen.",
"## Anatomie en fysiologie",
"Ken de anatomische segmenten, peritoneale relaties, bloedvoorziening, portale circulatie en enterische regulatie. Begrijp vertering, absorptie, gal- en pancreasfunctie en de rol van het microbioom.",
"## Pathologie",
"Belangrijke patronen zijn reflux, ulcusziekte, inflammatoire darmziekten, malabsorptie, appendicitis, diverticulaire ziekte, obstructie, pancreatitis, leverziekte en gastro-intestinale maligniteiten. Leer vooral onderscheidende presentatie en complicaties.",
"## Farmacologie",
"Bestudeer middelen tegen zuurproductie, misselijkheid, diarree en obstipatie en de belangrijkste geneesmiddelen voor inflammatoire darmziekten. Koppel farmacologische werking aan het segment of proces waarop het middel aangrijpt."
]},
{id:"med-hema",library:"medical",sectionId:MEDICAL_SECTION3_ID,title:"Hematologie en oncologie",body:[
"## Kern en focus",
"Section III benadrukt de samenhang tussen bloedcellen, beenmerg, immunologie en kanker. Besteed extra aandacht aan anemieën, bloeduitstrijkjes, stolling en antikankertherapie.",
"## Hematopoëse",
"Foetale erytropoëse verschuift tijdens de ontwikkeling van dooierzak naar lever, milt en uiteindelijk beenmerg. Globinesamenstelling verandert van embryonale naar foetale en volwassen hemoglobine.",
"## Rode en witte bloedcellen",
"Orden anemie op MCV en koppel het patroon aan ijzerstatus, reticulocyten, hemolyse en productieproblemen. Herken ook de basale patronen van leukocytenafwijkingen en bloeduitstrijkjes.",
"## Stolling en oncologie",
"Begrijp de interactie tussen primaire hemostase, stollingscascade en fibrinolyse. Bij oncologie gaat het om herkenning van hematologische maligniteiten, algemene tumorbiologie en de belangrijkste mechanismen van antikankermiddelen.",
"## Farmacologie",
"Ken de belangrijkste antistollings- en antiplateletklassen en de centrale geneesmiddelcategorieën bij hematologische en oncologische aandoeningen. Focus op mechanisme en onderscheidende toxiciteit."
]},
{id:"med-musculo",library:"medical",sectionId:MEDICAL_SECTION3_ID,title:"Bewegingsapparaat, huid en bindweefsel",body:[
"## Kern en focus",
"De systematiek combineert bot, gewrichten, spieren, huid en bindweefsel. Koppel anatomie aan bewegingspatronen, huidbevindingen en systemische aandoeningen.",
"## Anatomie en fysiologie",
"Ken de basis van botremodellering, kraakbeen, spiercontractie, perifere zenuwvoorziening en gewrichtsstructuren. Gebruik anatomische relaties om letsels en functieverlies te verklaren.",
"## Reumatologie",
"Maak onderscheid tussen inflammatoire, degeneratieve en kristalgeïnduceerde gewrichtsziekten. Let op symmetrie, gewrichtsverdeling, duur van klachten, extra-articulaire kenmerken en laboratoriumpatronen.",
"## Huid en bindweefsel",
"Herken patronen van inflammatie, infectie, auto-immuniteit en pigment- of keratinisatieproblemen. Bij bindweefselziekten zijn huid, gewrichten en interne organen vaak met elkaar verbonden.",
"## Farmacologie",
"Bestudeer analgetica, ontstekingsremmers, DMARD's en belangrijke middelen tegen botverlies en huidziekten vanuit hun werkingsmechanisme en risico's."
]},
{id:"med-neuro",library:"medical",sectionId:MEDICAL_SECTION3_ID,title:"Neurologie en speciale zintuigen",body:[
"## Kern en focus",
"Belangrijk zijn motorische en sensibele banen, cerebellum, hersenzenuwen, vaatgebieden, neurodegeneratie, epilepsie, oogheelkunde en otologie.",
"## Embryologie en anatomie",
"De neurale plaat vormt de neurale buis en neurale lijst. Dorsale en ventrale delen van het ruggenmerg zijn functioneel gescheiden in sensibele en motorische systemen. Begrijp de regionale ontwikkeling van het brein.",
"## Neurologische fysiologie",
"Ken de belangrijkste motorische, sensibele, cerebellaire en visuele banen. Lokaliseer laesies via het patroon van uitval en gebruik dat patroon om onderscheid te maken tussen centrale en perifere aandoeningen.",
"## Pathologie",
"Herken beroertepatronen, demyeliniserende ziekten, neurodegeneratieve aandoeningen, perifere neuropathieën, ruggenmergsyndromen en intracraniële processen. Beeldvorming en neuropathologische kenmerken helpen bij herkenning.",
"## Oog, oor en farmacologie",
"Speciale zintuigen vragen om anatomische lokalisatie: retina, oogmotoriek, visuele banen, midden- en binnenoor. Bij farmacologie zijn onder andere anti-epileptica, Parkinsonmedicatie, antimigraine-middelen en analgetica belangrijk."
]},
{id:"med-psych",library:"medical",sectionId:MEDICAL_SECTION3_ID,title:"Psychiatrie",body:[
"## Kern en focus",
"Psychiatrie koppelt psychologie, psychiatrische diagnostiek, sociologie en psychofarmacologie. Belangrijke groepen zijn psychotische, stemmings-, angst-, eet-, persoonlijkheids-, somatische-symptoom- en middelenstoornissen.",
"## Psychologie",
"Ken klassieke en operante conditionering en de basis van leerprocessen. Begrijp ook overdracht, tegenoverdracht en de rol van afweermechanismen bij psychisch functioneren.",
"## Diagnostiek",
"Let bij psychiatrische vignetten op symptoomcluster, duur, functionele beperkingen, leeftijd van begin en eventuele middelen of somatische oorzaken. De differentiaaldiagnose wordt vaak door tijdsduur en context bepaald.",
"## Pathologie",
"Herken kernpatronen van schizofreniespectrum, depressieve en bipolaire stoornissen, angst- en trauma-gerelateerde stoornissen, eetstoornissen, persoonlijkheidsstoornissen en verslavingsproblematiek.",
"## Farmacologie",
"Ken de belangrijkste antidepressiva, antipsychotica, stemmingsstabilisatoren, anxiolytica en middelen bij verslaving. Focus op therapeutisch doel, mechanisme en de karakteristieke bijwerkingen."
]},
{id:"med-renal",library:"medical",sectionId:MEDICAL_SECTION3_ID,title:"Renaal",body:[
"## Kern en focus",
"Renale fysiologie is een kernonderdeel van Section III. Belangrijke verbanden zijn glomerulaire functie, tubulaire transportprocessen, zuur-base, elektrolyten, acute en chronische nierschade en diuretica.",
"## Embryologie",
"De definitieve nier ontstaat uit interactie tussen ureterknop en metanefrisch mesenchym. Afwijkende ontwikkeling kan nieragenesie, cystische afwijkingen en obstructieve problemen geven.",
"## Anatomie en fysiologie",
"Ken glomerulus, proximale tubulus, lis van Henle, distale tubulus en verzamelbuis. Begrijp GFR, filtratie, reabsorptie, secretie, renine-angiotensine-aldosteron en de regeling van water, natrium, kalium en zuur-base.",
"## Pathologie",
"Bestudeer glomerulaire syndromen, nierstenen, tubulo-interstitiële aandoeningen, acute nierschade en chronische nierziekte. Urinesediment en cilinders kunnen helpen bij lokalisatie van de afwijking.",
"## Farmacologie",
"Ken lis-, thiazide- en kaliumsparende diuretica en de plaats van ACE-remmers en AT1-antagonisten. Koppel de werking aan het nefronsegment en let op elektrolyt- en nierfunctieveranderingen."
]},
{id:"med-repro",library:"medical",sectionId:MEDICAL_SECTION3_ID,title:"Reproductie",body:[
"## Kern en focus",
"Orden het onderwerp langs embryologie, anatomie, endocrinologie, zwangerschap, seksuele ontwikkeling en reproductieve oncologie.",
"## Embryologie",
"Belangrijke thema's zijn vroege embryonale ontwikkeling, gastrulatie, geslachtsdifferentiatie en de Müller- en Wolff-systemen. Gebruik embryologie om congenitale afwijkingen en verschillen in seksuele ontwikkeling te begrijpen.",
"## Endocrinologie en fysiologie",
"Begrijp de hypothalamus-hypofyse-gonade-as, folliculaire ontwikkeling, ovulatie, menstruatie, spermatogenese en hormonale feedback. Koppel zwangerschap aan placentaire hormonen en fysiologische veranderingen.",
"## Pathologie",
"Herken patronen van infertiliteit, menstruatiestoornissen, polycysteus-ovariumsyndroom, endometriose, seksueel overdraagbare aandoeningen en afwijkingen van zwangerschap. Bij kanker zijn presentatie, risicofactoren, histologie en tumormarkers belangrijke herkenningspunten.",
"## Farmacologie",
"Ken de principes van anticonceptie, fertiliteitsbehandeling, hormoontherapie en middelen die invloed hebben op het urinair of reproductief systeem. Begrijp vooral het hormonale aangrijpingspunt."
]},
{id:"med-resp",library:"medical",sectionId:MEDICAL_SECTION3_ID,title:"Respiratoir",body:[
"## Kern en focus",
"Verbind normale ademhalingsfysiologie met obstructieve en restrictieve longziekten, ventilatie-perfusie, gaswisseling, longvolumes en longmaligniteiten.",
"## Embryologie",
"De longontwikkeling verloopt via embryonale, pseudoglandulaire, canaliculaire, sacculaire en alveolaire fasen. Timing van pneumocytontwikkeling en surfactantproductie verklaart een deel van de klinische gevolgen van prematuriteit.",
"## Anatomie en fysiologie",
"Ken luchtwegboom, alveoli, pleura en pulmonale circulatie. Begrijp ventilatie, perfusie, diffusie, V/Q-verhoudingen, zuurstoftransport, CO2-afvoer, longvolumes en de mechanica van ademhaling.",
"## Pathologie",
"Maak onderscheid tussen obstructieve en restrictieve patronen en herken astma, COPD, pneumonie, interstitiële longziekten, pulmonale hypertensie, pleurale aandoeningen en longkanker. Gebruik klachten, beeldvorming en longfunctieonderzoek samen.",
"## Farmacologie",
"Ken bronchodilatatoren, inhalatiecorticosteroïden, antimicrobiële behandeling van relevante infecties en middelen voor specifieke longziekten. Koppel effect aan luchtwegspiertonus, inflammatie of infectieuze oorzaak."
]},
{id:"med-rapid",library:"medical",sectionId:MEDICAL_SECTION3_ID,title:"Rapid Review — Section III",body:[
"## Hoe gebruik je Rapid Review?",
"Gebruik dit hoofdstuk als compacte herhaling nadat de orgaansystemen zijn bestudeerd. Zoek eerst naar het ziektebeeld of de fysiologische relatie en controleer daarna de bijbehorende onderscheidende kenmerken.",
"## Hoogwaardige verbanden",
"Cardiovasculair, respiratoir en renaal moeten vaak samen worden geleerd. Endocriene regulatie loopt door in metabole, reproductieve en renale processen. Neurologische lokalisatie vraagt een combinatie van anatomie, fysiologie en pathologie.",
"## Klinische herkenning",
"Train jezelf om uit een vignette eerst de dominante klinische patronen te halen: tijdsbeloop, lokalisatie, risicofactoren, kernsymptomen, laboratoriumafwijkingen, beeldvorming en de belangrijkste complicatie.",
"## Toetsstrategie",
"Leer de onderscheidende associaties en mechanismen, maar combineer ze altijd met de klinische context. Wanneer twee aandoeningen op elkaar lijken, zoek dan naar één bevinding die het meest specifiek onderscheid maakt."
]}];

function ensureMedicalLibrary(x){
 var i,exists=false,srcExists=false;
 if(!x.medicalLibraryVersion||x.medicalLibraryVersion<MEDICAL_LIBRARY_VERSION){
   for(i=0;i<MEDICAL_SECTIONS.length;i++)if(!byId(x.sections,MEDICAL_SECTIONS[i].id))x.sections.push(clone(MEDICAL_SECTIONS[i]));
   if(!byId(x.articles,MEDICAL_ARTICLES[0].id))for(i=0;i<MEDICAL_ARTICLES.length;i++)if(!byId(x.articles,MEDICAL_ARTICLES[i].id))x.articles.push(clone(MEDICAL_ARTICLES[i]));
   else for(i=1;i<MEDICAL_ARTICLES.length;i++)if(!byId(x.articles,MEDICAL_ARTICLES[i].id))x.articles.push(clone(MEDICAL_ARTICLES[i]));
   if(!byId(x.sources,MEDICAL_SOURCE.id))x.sources.push(clone(MEDICAL_SOURCE));
   for(i=0;i<x.articles.length;i++)if(x.articles[i].library==="medical"&&!has(x.articles[i].sourceIds||[],MEDICAL_SOURCE.id))x.articles[i].sourceIds=[MEDICAL_SOURCE.id].concat(x.articles[i].sourceIds||[]);
   x.medicalLibraryVersion=MEDICAL_LIBRARY_VERSION;
   saveStateFor(x);
 }
}
function saveStateFor(x){localStorage.setItem(KEY,JSON.stringify(x))}
function normalizeArticleLibraries(x){
 var i,a,sec;
 for(i=0;i<x.articles.length;i++){a=x.articles[i];sec=byId(x.sections,a.sectionId);if(sec&&sec.library==="medical")a.library="medical";else if(!a.library||a.library==="medical")a.library="ivtg"}
}
var state=load();if(!state.ui)state.ui={};if(!state.ui.adminTab)state.ui.adminTab="sections";if(!state.ui.adminQuestionModule)state.ui.adminQuestionModule="qbank";
function purgeHarmonisedLabSource(x){
 var i,j,sid;
 for(i=x.sources.length-1;i>=0;i--)if(x.sources[i].id==="s13"||/harmoni[sz]ed reference intervals/i.test(String(x.sources[i].title||""))){
  sid=x.sources[i].id;x.sources.splice(i,1);
  for(j=0;j<x.questions.length;j++)x.questions[j].sourceIds=removeId(x.questions[j].sourceIds,sid);
  for(j=0;j<x.articles.length;j++)x.articles[j].sourceIds=removeId(x.articles[j].sourceIds,sid);
 }
}
function load(){
 try{
  var x=JSON.parse(localStorage.getItem(KEY));
  if(x && Array.isArray(x.questions) && Array.isArray(x.articles) && Array.isArray(x.sources) && Array.isArray(x.sections)){
    if(!x.answers || typeof x.answers!=="object")x.answers={};
    if(!Array.isArray(x.attempts))x.attempts=[];
    if(!x.notes || typeof x.notes!=="object")x.notes={};
    if(!Array.isArray(x.feedback))x.feedback=[];
    if(!x.highlights || typeof x.highlights!=="object")x.highlights={};
    if(!x.questionMarks || typeof x.questionMarks!=="object")x.questionMarks={};
    if(!x.chapterTime || typeof x.chapterTime!=="object")x.chapterTime={};
    if(x.theme!=="dark"&&x.theme!=="light")x.theme="light";
    if(!x.name)x.name="Student";
    if(!x.benchmark || typeof x.benchmark!=="object")x.benchmark={medianScore:null,percentile:null,otherAvgTime:null,sampleSize:0};
    if(!x.ui || typeof x.ui!=="object")x.ui={};
    migrateABCD(x);
    if(ensureQuestionBankSeeds(x))localStorage.setItem(KEY,JSON.stringify(x));
    ensureMedicalLibrary(x);
    normalizeArticleLibraries(x);
    if(migrateInlineImages(x))localStorage.setItem(KEY,JSON.stringify(x));
    purgeHarmonisedLabSource(x);
    return x;
  }
 }catch(e){}
 var fresh={questions:clone(QUESTIONS),articles:clone(ARTICLES),sources:clone(SOURCES),sections:clone(SECTIONS),answers:{},attempts:[],notes:{},feedback:[],highlights:{},questionMarks:{},chapterTime:{},name:"Student",theme:"light",benchmark:{medianScore:null,percentile:null,otherAvgTime:null,sampleSize:0}};
 migrateABCD(fresh);
 fresh.questionSeedVersion=QUESTION_SEED_VERSION;
 ensureMedicalLibrary(fresh);
 normalizeArticleLibraries(fresh);
 migrateInlineImages(fresh);
 purgeHarmonisedLabSource(fresh);
 localStorage.setItem(KEY,JSON.stringify(fresh));return fresh;
}
function migrateABCD(x){
 var i;
 for(i=0;i<x.questions.length;i++){
   if(!x.questions[i].options)x.questions[i].options=["","","",""];
   x.questions[i].options=x.questions[i].options.slice(0,4);
   while(x.questions[i].options.length<4)x.questions[i].options.push("");
   if(x.questions[i].correct>3)x.questions[i].correct=0;
   if(!x.questions[i].modules||typeof x.questions[i].modules!=="object")x.questions[i].modules={qbank:true,ivtg:true};
   if(typeof x.questions[i].modules.qbank!=="boolean")x.questions[i].modules.qbank=true;
   if(typeof x.questions[i].modules.ivtg!=="boolean")x.questions[i].modules.ivtg=true;
   if(isQbankSubject(x.questions[i].subject)){x.questions[i].modules.qbank=true;x.questions[i].modules.ivtg=false}
   if(x.questions[i].id==="q9"||x.questions[i].id==="q10"){x.questions[i].modules.qbank=true;x.questions[i].modules.ivtg=false}
 }
}
var QUESTION_SEED_VERSION=1;
function ensureQuestionBankSeeds(x){
 if((Number(x.questionSeedVersion)||0)>=QUESTION_SEED_VERSION)return false;
 var changed=false,i,q;
 for(i=0;i<QUESTIONS.length;i++){
   q=QUESTIONS[i];
   if((q.id==="q9"||q.id==="q10")&&!byId(x.questions,q.id)){x.questions.push(clone(q));changed=true;}
 }
 if(!byId(x.sources,"s27")){var gonSource=byId(SOURCES,"s27");if(gonSource){x.sources.push(clone(gonSource));changed=true;}}
 x.questionSeedVersion=QUESTION_SEED_VERSION;
 return changed;
}
function clone(x){return JSON.parse(JSON.stringify(x))}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function isQuestionMarked(id){return !!(state.questionMarks&&state.questionMarks[id])}
function toggleQuestionMark(id){if(!state.questionMarks||typeof state.questionMarks!=="object")state.questionMarks={};if(state.questionMarks[id])delete state.questionMarks[id];else state.questionMarks[id]=true;save();render()}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function migrateInlineImages(x){
 var changed=false,i,j,text,id,src;
 for(i=0;i<x.articles.length;i++){
  var a=x.articles[i];if(!a.inlineImages||typeof a.inlineImages!=="object")a.inlineImages={};
  text=(a.body||[]).join("\n\n");
  text=text.replace(/\[(?:image|afbeelding):([^\]]+)\]/gi,function(_,raw){
    src=String(raw||"").trim();
    if(src.indexOf("inlineimg:")===0){
      id=src.slice(10);
      return "[inlineimg:"+id+"]";
    }
    id="img"+Date.now().toString(36)+(i.toString(36))+(Math.random().toString(36).slice(2,7));
    a.inlineImages[id]=src;
    changed=true;
    return "[inlineimg:"+id+"]";
  });
  if(text.indexOf("[inlineimg:")>=0){
    var ids=[],m;
    var re=/\[inlineimg:([^\]]+)\]/gi;
    while((m=re.exec(text)))ids.push(m[1]);
    for(j=0;j<ids.length;j++)if(!a.inlineImages[ids[j]]){ /* leave unresolved token visible in editor */ }
  }
  a.body=text.split(/\n\s*\n/);
 }
 return changed;
}
function renderInlineImages(html){
 return String(html||"").replace(/\[inlineimg:([^\]]+)\]/gi,function(_,id){
   return "<span class='inline-image-live' data-inline-live-id='"+esc(String(id).trim())+"' data-inline-live-open='0'><span class='inline-image-label'>[afbeelding]</span></span>";
 });
}
function articleEditorHtml(a){
 if(a&&a.richHtml)return sanitizeRichHtml(a.richHtml);
 var text=(a.body||[]).join("\n\n"),images=a.inlineImages||{},widths=a.inlineImageWidths||{};
 text=esc(text);
 text=text.replace(/\[inlineimg:([^\]]+)\]/gi,function(_,rawId){
  var id=String(rawId).trim(),src=images[id],w=parseInt(widths[id],10)||180;
  if(!src)return "<span class='inline-image-editor-broken' data-inline-editor-id='"+esc(id)+"'>[afbeelding]</span>";
  return "<span class='inline-image-editor' tabindex='0' draggable='true' contenteditable='false' data-inline-editor-id='"+esc(id)+"' title='Klik voor grootte · sleep om te verplaatsen'><img src='"+esc(src)+"' alt='' style='width:"+w+"px'></span>";
 });
 return text.replace(/\n/g,"<br>");
}
function serializeArticleEditor(root){
 function walk(node){
   var out="",i;
   if(node.nodeType===3)return node.nodeValue;
   if(node.nodeType!==1)return "";
   if(node.classList&&node.classList.contains("inline-image-editor"))return "[inlineimg:"+node.getAttribute("data-inline-editor-id")+"]";
   if(node.tagName==="BR")return "\n";
   for(i=0;i<node.childNodes.length;i++)out+=walk(node.childNodes[i]);
   if(node.tagName==="DIV"||node.tagName==="P")out+="\n";
   return out;
 }
 return walk(root).replace(/\n{3,}/g,"\n\n").trim();
}
function md(s){var x=esc(s||"");x=x.replace(/\*([^*]+)\*/g,"<strong class='term'>$1</strong>");x=x.replace(/\n/g,"<br>");return renderInlineImages(x)}
function byId(arr,id){var i;for(i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}
function idx(arr,id){var i;for(i=0;i<arr.length;i++)if(arr[i].id===id)return i;return -1}
function removeBy(arr,id){var i;for(i=arr.length-1;i>=0;i--)if(arr[i].id===id)arr.splice(i,1)}
function removeId(arr,id){var o=[],i;if(!arr)return o;for(i=0;i<arr.length;i++)if(arr[i]!==id)o.push(arr[i]);return o}
function has(arr,x){var i;for(i=0;i<arr.length;i++)if(arr[i]===x)return true;return false}

function formatTime(sec){
 sec=Math.max(0,Number(sec)||0);
 var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);
 return (h?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
var activeChapterId=null,activeChapterStarted=0,chapterTimerHandle=null;
function startChapterTimer(id){
 flushChapterTimer();
 activeChapterId=id;
 activeChapterStarted=new Date().getTime();
 if(chapterTimerHandle)clearInterval(chapterTimerHandle);
 chapterTimerHandle=setInterval(function(){
   var e=document.getElementById("chapterTimer");
   if(e)e.innerHTML="Tijd besteed: "+formatTime(currentChapterSeconds());
 },1000);
}
function flushChapterTimer(){
 if(!activeChapterId||!activeChapterStarted)return;
 var sec=Math.floor((new Date().getTime()-activeChapterStarted)/1000);
 state.chapterTime[activeChapterId]=(state.chapterTime[activeChapterId]||0)+Math.max(0,sec);
 activeChapterStarted=new Date().getTime();
 save();
}
function stopChapterTimer(){
 flushChapterTimer();
 if(chapterTimerHandle)clearInterval(chapterTimerHandle);
 chapterTimerHandle=null;activeChapterStarted=0;activeChapterId=null;
}
function currentChapterSeconds(){
 var id=activeChapterId||articleId,base=state.chapterTime[id]||0;
 if(activeChapterId===id&&activeChapterStarted)base+=Math.floor((new Date().getTime()-activeChapterStarted)/1000);
 return base;
}

function stats(){var n=0,c=0,k;for(k in state.answers)if(state.answers.hasOwnProperty(k)){n++;if(state.answers[k].correct)c++}return{n:n,c:c,acc:n?Math.round(c/n*100):null}}
function srcFoot(ids){var h="",i,s;ids=ids||[];for(i=0;i<ids.length;i++){s=byId(state.sources,ids[i]);if(s)h+="<div><span class='sup'>["+(i+1)+"]</span> "+esc(s.title)+" — <a href='"+esc(s.url)+"' target='_blank'>bron openen</a></div>"}return h}

function qbank(){
 var buttons="",i,j,q,count;
 for(i=0;i<QBANK_SUBJECTS.length;i++){
  count=0;
  for(j=0;j<state.questions.length;j++){q=state.questions[j];if(q.subject===QBANK_SUBJECTS[i]&&((q.modules||{qbank:true}).qbank!==false))count++}
  buttons+="<button class='ivtg-subject-choice' data-qbank-subject='"+esc(QBANK_SUBJECTS[i])+"' "+(count===0?"disabled":"")+"><span>"+esc(QBANK_SUBJECTS[i])+"</span><span>"+count+" "+(count===1?"vraag":"vragen")+" ›</span></button>";
 }
 return shell("<div class='pagehead ivtg-landing-head'><div><h1>Vragenbank</h1><p>Oefen met casusgerichte vragen binnen de zes vaste Qbank-onderwerpen.</p></div></div>"+

 "<div class='ivtg-welcome'><div class='small'>MEDQNL • VRAGENBANK</div><h2>Kies hoe je wilt oefenen.</h2><p>Deze onderwerpen horen bij de Vragenbank en niet bij de iVTG Trainer.</p></div>"+
 "<div class='ivtg-start-grid'>"+
 "<div class='ivtg-start-card'><div class='ivtg-card-icon'>▶</div><h3>Start</h3><p>Start een gemengde Qbank-oefensessie.</p><button class='btn primary' id='startqb'>Start</button></div>"+

    var ow=img.naturalWidth||img.width||1,oh=img.naturalHeight||img.height||1,scale=Math.min(1,maxEdge/Math.max(ow,oh));

   };img.onerror=function(){resolve(src)};img.src=src;

}

function showAppError(err){

  var msg=err&&err.message?err.message:String(err||"Onbekende fout");
  root.innerHTML="<div style='min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:#f5f7f9;font-family:Arial,sans-serif;color:#1e2a36'><div style='max-width:760px;background:#fff;border:1px solid #d8e0e7;border-radius:12px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)'><h1 style='margin:0 0 8px'>MedQNL kon niet worden geladen</h1><p style='margin:0 0 12px;color:#70808e'>De fout is automatisch opgevangen. Vernieuw de pagina om opnieuw te proberen.</p><pre style='white-space:pre-wrap;font-size:12px;background:#f5f7f9;padding:12px;border-radius:8px'>"+esc(msg)+"</pre></div></div>";
}
