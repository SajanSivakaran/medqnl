<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nieuw wachtwoord | MedQNL</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f0;color:#20352c;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}.card{width:min(100%,420px);background:white;border:1px solid #dbe5dc;border-radius:16px;padding:32px;box-shadow:0 12px 36px #20352c0d}h1{font-size:28px;margin:0 0 8px}p{color:#64766b;line-height:1.5}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #dbe5dc;border-radius:9px;font:inherit}button{margin-top:22px;width:100%;border:0;border-radius:9px;background:#245a49;color:white;padding:14px;font-weight:800;font-size:15px;cursor:pointer}.status{font-size:14px;overflow-wrap:anywhere;color:#a33b32}a{color:#245a49;font-weight:700}</style></head><body><main class="card"><h1>Kies een nieuw wachtwoord</h1><p>Open deze pagina via de resetlink in de e-mail. Kies daarna een nieuw wachtwoord voor je MedQNL-account.</p><form id="form"><label for="pw">Nieuw wachtwoord</label><input id="pw" type="password" minlength="8" autocomplete="new-password" required placeholder="Minimaal 8 tekens"><label for="pw2">Herhaal wachtwoord</label><input id="pw2" type="password" minlength="8" autocomplete="new-password" required placeholder="Typ het opnieuw"><button id="btn">Wachtwoord opslaan</button><p id="status" class="status" role="status"></p></form><p><a href="/medqnl/inloggen/">Terug naar inloggen</a></p></main><script>
(async()=>{const status=document.getElementById('status');const params=new URLSearchParams(location.hash.slice(1));let access=params.get('access_token');const type=params.get('type');if(!access&&params.get('error_description'))status.textContent=decodeURIComponent(params.get('error_description').replace(/\+/g,' '));if(!access&&location.search){const q=new URLSearchParams(location.search);const tokenHash=q.get('token_hash');if(tokenHash){try{const r=await fetch('https://lwgbufaxwfrzqlonhmry.supabase.co/auth/v1/verify',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_CYEpEZ_WZx9OvCT_yrH2Tg_7Oy77IL3'},body:JSON.stringify({token_hash:tokenHash,type:'recovery'})});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.message||'De resetlink is ongeldig of verlopen.');access=d.access_token;}catch(e){status.textContent=e.message;}}}if(!access|| (type && type!=='recovery')){status.textContent=status.textContent||'Geen geldige herstellink gevonden. Vraag een nieuwe resetlink aan via de inlogpagina.';document.getElementById('btn').disabled=true;return;}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value,pw2=document.getElementById('pw2').value;if(pw!==pw2){status.textContent='De wachtwoorden zijn niet gelijk.';return;}const btn=document.getElementById('btn');btn.disabled=true;status.textContent='Wachtwoord wordt opgeslagen…';try{const r=await fetch('https://lwgbufaxwfrzqlonhmry.supabase.co/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json','apikey':'sb_publishable_CYEpEZ_WZx9OvCT_yrH2Tg_7Oy77IL3','Authorization':'Bearer '+access},body:JSON.stringify({password:pw})});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.message||d.error_description||'Wachtwoord wijzigen is mislukt.');status.style.color='#245a49';status.textContent='Wachtwoord opgeslagen. Je kunt nu inloggen.';document.getElementById('form').reset();}catch(err){status.textContent=err.message;}finally{btn.disabled=false;}});})();
</script></body></html>
