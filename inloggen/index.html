<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Inloggen | MedQNL</title>
<style>
:root{color-scheme:light;--green:#245a49;--ink:#20352c;--muted:#64766b;--line:#dbe5dc;--paper:#f7f7f0;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
body{min-height:100vh}
.page{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,520px)}
.brand-panel{background:linear-gradient(145deg,#214e45,#16392f);color:#fff;padding:clamp(28px,6vw,80px);display:flex;flex-direction:column;justify-content:space-between}
.logo{font-weight:850;font-size:27px;letter-spacing:-1px;color:white;text-decoration:none}.logo span{color:#b8dfc5}
.intro{max-width:560px;margin:auto 0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:#b8dfc5}.intro h1{font-size:clamp(34px,4.5vw,60px);line-height:1.06;letter-spacing:-2px;margin:18px 0}.intro p{font-size:17px;line-height:1.7;color:#e0ece4;max-width:460px}.foot{font-size:12px;color:#c0d4c8}
.login-panel{display:flex;align-items:center;justify-content:center;padding:clamp(22px,5vw,64px);background:var(--paper)}
.card{width:100%;max-width:390px}.mobile-logo{display:none;color:var(--green);font-size:24px;font-weight:850;text-decoration:none}.mobile-logo span{color:#5a9b78}
h2{font-size:32px;letter-spacing:-1px;margin:0 0 10px}.sub{margin:0 0 30px;color:var(--muted);line-height:1.6;font-size:14px}
label{display:block;font-size:13px;font-weight:750;margin:18px 0 8px}
input{width:100%;padding:14px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink);outline:none}
input:focus{border-color:#4f9273;box-shadow:0 0 0 3px #4f927320}
.submit{margin-top:24px;width:100%;border:0;border-radius:10px;background:var(--green);color:#fff;padding:14px;font-weight:800;font-size:15px;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}
.status{min-height:22px;margin-top:14px;font-size:13px;line-height:1.5;color:#a33b32}
.back{display:inline-block;margin-top:22px;color:var(--green);font-weight:700;text-decoration:none;font-size:14px}
@media(max-width:760px){.page{display:block}.brand-panel{display:none}.login-panel{min-height:100vh;padding:28px 22px}.mobile-logo{display:inline-block;margin-bottom:42px}h2{font-size:29px}}
</style>
</head>
<body>
<main class="page">
  <section class="brand-panel">
    <a class="logo" href="/medqnl/">MedQ<span>NL</span></a>
    <div class="intro"><div class="eyebrow">JOUW MEDISCHE STUDIEPLEK</div><h1>Welkom terug bij MedQNL.</h1><p>Log in om verder te gaan met je medische leeromgeving, oefenvragen en opgeslagen materiaal.</p></div>
    <div class="foot">© 2026 MedQNL</div>
  </section>
  <section class="login-panel">
    <div class="card">
      <a class="mobile-logo" href="/medqnl/">MedQ<span>NL</span></a>
      <h2>Inloggen</h2>
      <p class="sub">Vul je e-mailadres en wachtwoord in om verder te gaan.</p>
      <form id="loginForm">
        <label for="email">E-mailadres</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="naam@voorbeeld.nl" required>
        <label for="password">Wachtwoord</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Je wachtwoord" required>
        <button class="submit" id="submit" type="submit">Inloggen</button>
        <p style="margin:14px 0 0;font-size:13px"><a href="#" id="forgot" style="color:var(--green);font-weight:700">Wachtwoord vergeten?</a></p>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
      <a class="back" href="/medqnl/">← Terug naar de introductiepagina</a>
    </div>
  </section>
</main>
<script>
(function(){
 const form=document.getElementById('loginForm'), status=document.getElementById('status'), button=document.getElementById('submit');
 document.getElementById('forgot').addEventListener('click',async function(e){e.preventDefault();const email=document.getElementById('email').value.trim();if(!email){status.textContent='Vul eerst je e-mailadres in.';document.getElementById('email').focus();return;}status.textContent='Resetlink wordt aangevraagd…';try{const r=await fetch('https://lwgbufaxwfrzqlonhmry.supabase.co/auth/v1/recover?redirect_to='+encodeURIComponent('https://sajansivakaran.github.io/medqnl/wachtwoord-reset/'),{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_CYEpEZ_WZx9OvCT_yrH2Tg_7Oy77IL3'},body:JSON.stringify({email})});if(!r.ok){const d=await r.json();throw new Error(d.msg||d.message||'Resetlink aanvragen is mislukt.');}status.style.color='var(--green)';status.textContent='Als dit account bestaat, is een resetmail verstuurd. Controleer je inbox en spammap.';}catch(err){status.style.color='#a33b32';status.textContent=err.message;}});
 form.addEventListener('submit',async function(event){
   event.preventDefault();status.textContent='Inloggen wordt gecontroleerd…';button.disabled=true;
   try{
     const response=await fetch('https://lwgbufaxwfrzqlonhmry.supabase.co/auth/v1/token?grant_type=password',{
       method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_CYEpEZ_WZx9OvCT_yrH2Tg_7Oy77IL3'},
       body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})
     });
     const data=await response.json();
     if(!response.ok)throw new Error(data.msg||data.message||data.error_description||'Inloggen is niet gelukt. Controleer je gegevens.');
     sessionStorage.setItem('medqnl_login_access_token',data.access_token);
     status.textContent='Inloggen is gelukt. De dashboardtoegang moet nog worden gecontroleerd.';
   }catch(error){status.textContent=error.message||'Er ging iets mis. Probeer het opnieuw.'}
   finally{button.disabled=false}
 });
})();
</script>
</body>
</html>
